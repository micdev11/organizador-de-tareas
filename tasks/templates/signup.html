{% extends 'base.html' %} 
{% block content %}



<main class="container">
  <div class="row">
    <section class="col-md-4 offset-md-4 mt-5">
      <form action="/signup/" method="POST class="card card-body">
        <h1 class="text-center mb-3">Registrarse</h1>
        {{error}}
        {% csrf_token %} 

        <div class="mb-3">
          <label for="username">Nombre de usuario</label>
          <input type="text" name="username" id="username" class="form-control" required 
          placeholder="Escribe tu nombre de usuario"/>
        </div>

        <div class="mb-3">
          <label for="password1">Contraseña</label>
          <input type="password" name="password1" id="password1" 
          class="form-control" required placeholder="Escribe tu contraseña"/>
        </div>

        <div class="mb-3">
          <label for="password2">Confirma tu contraseña</label>
          <input type="password" name="password2" id="password2" 
          class="form-control" required placeholder="Repite contraseña"/>
        </div>
        <button class="btn btn-primary">Enviar</button>
      </form>
    </section>
  </div>
</main>

{% endblock %}
